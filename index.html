            { zh: '坚持', py: 'jiānchí', uz: 'qat\'iy turmoq', ru: 'настаивать, упорствовать', en: 'persist / persevere' },
            { zh: '放弃', py: 'fàngqì', uz: 'voz kechmoq', ru: 'отказываться, бросать', en: 'give up' },

        const DIALOGUES = [
            {
                id: '09-1',
                context: '王静和孙月聊孙月减肥的事情',
                lines: [
                    { speaker: '王静', zh: '怎么又买了这么多饼干和巧克力？难道你不减肥了？', py: 'Zěnme yòu mǎile zhème duō bǐnggān hé qiǎokèlì? Nándào nǐ bù jiǎnféi le?', uz: 'Nega yana shuncha pechenye va shokolad sotib olding? Nahotki ozishni to\'xtatgan bo\'lsang?', ru: 'Почему ты опять купила так много печенья и шоколада? Неужели ты больше не худеешь?', en: 'Why did you buy so many biscuits and chocolates again? Could it be you are not losing weight anymore?' },
                    { speaker: '孙月', zh: '减了一个月都没瘦下来，我实在没有信心了。', py: 'Jiǎnle yí ge yuè dōu méi shòu xiàlai, wǒ shízài méiyǒu xìnxīn le.', uz: 'Bir oy ozishga harakat qildim, lekin ozmadim, menda umuman ishonch qolmadi.', ru: 'Худела месяц и так и не похудела, у меня совсем не осталось уверенности.', en: 'I tried to lose weight for a month but didn\'t get thinner, I really have no confidence left.' },
                    { speaker: '王静', zh: '如果你想减肥，就得少吃东西，而且要多运动。', py: 'Rúguǒ nǐ xiǎng jiǎnféi, jiù děi shǎo chī dōngxi, érqiě yào duō yùndòng.', uz: 'Agar ozishni xohlasang, kamroq ovqat yeyishing kerak, va ko\'proq sport bilan shug\'ullanishing kerak.', ru: 'Если хочешь похудеть, нужно меньше есть, к тому же больше заниматься спортом.', en: 'If you want to lose weight, you must eat less, and exercise more.' },
                    { speaker: '孙月', zh: '我就是这么做的，但这一个月下来，我只轻了一公斤。', py: 'Wǒ jiù shì zhème zuò de, dàn zhè yí ge yuè xiàlai, wǒ zhǐ qīngle yì gōngjīn.', uz: 'Men shunday qilyapman, lekin bu bir oy ichida faqat bir kilogrammga ozdim.', ru: 'Я так и делаю, но за этот месяц я похудела всего на один килограмм.', en: 'That\'s what I\'m doing, but over this month, I\'ve only lost one kilogram.' },
                    { speaker: '王静', zh: '一个月太短了。要想减肥成功，只能坚持，才会慢慢有效果。', py: 'Yí ge yuè tài duǎn le. Yào xiǎng jiǎnféi chénggōng, zhǐ néng jiānchí, cái huì mànmàn yǒu xiàoguǒ.', uz: 'Bir oy juda qisqa vaqt. Muvaffaqiyatli ozish uchun, faqat qat\'iy turish kerak, shundagina sekin-asta natija bo\'ladi.', ru: 'Один месяц — это слишком мало. Чтобы успешно похудеть, можно только упорствовать, только тогда постепенно будет результат.', en: 'One month is too short. To succeed in losing weight, you can only persist, then slowly there will be results.' },
                    { speaker: '孙月', zh: '我本来已经打算放弃了，但是你刚才的话让我改变了主意。这些饼干和巧克力送给你了。', py: 'Wǒ běnlái yǐjīng dǎsuàn fàngqì le, dànshì nǐ gāngcái de huà ràng wǒ gǎibiànle zhǔyi. Zhèxiē bǐnggān hé qiǎokèlì sòng gěi nǐ le.', uz: 'Men aslida voz kechmoqchi edim, lekin sening hozirgi gaping fikrimni o\'zgartirdi. Bu pechenye va shokoladlarni senga sovg\'a qildim.', ru: 'Вообще-то я уже собиралась сдаться, но твои слова только что заставили меня передумать. Это печенье и шоколад дарю тебе.', en: 'I originally planned to give up, but your words just now made me change my mind. I give these biscuits and chocolates to you.' }
                ]
            },
            {
                id: '09-2',
                context: '李进和张远聊张远的成功经历',
                lines: [
                    { speaker: '李进', zh: '你网球打得真好，还拿过那么多国际大奖！每次看你比赛，感觉你轻轻松松就赢了。', py: 'Nǐ wǎngqiú dǎ de zhēn hǎo, hái náguo nàme duō guójì dàjiǎng! Měicì kàn nǐ bǐsài, gǎnjué nǐ qīngqīngsōngsōng jiù yíng le.', uz: 'Tennisni juda yaxshi o\'ynaysan, shuncha ko\'p xalqaro mukofotlarni ham olgansan! Har safar musobaqangni ko\'rganimda, xuddi osonlik bilan yutib olgandeksan.', ru: 'Ты так хорошо играешь в теннис, еще и получил столько международных наград! Каждый раз, смотря твои соревнования, кажется, что ты выигрываешь очень легко.', en: 'You play tennis so well, and have won so many international awards! Every time I watch your matches, it feels like you win so easily.' },
                    { speaker: '张远', zh: '哪里啊！那是你没看到我辛苦练习的一面，没有人随随便便就能成功的。', py: 'Nǎli a! Nà shì nǐ méi kàndào wǒ xīnkǔ liànxí de yí miàn, méiyǒu rén suísuíbiànbiàn jiù néng chénggōng de.', uz: 'Qayoqda! Bu sen mening qattiq mashq qilgan tomonimni ko\'rmaganingdan, hech kim o\'z-o\'zidan muvaffaqiyatga erisha olmaydi.', ru: 'Да что ты! Это ты просто не видел ту сторону, где я тяжело тренируюсь, никто не может добиться успеха просто так.', en: 'Not at all! That\'s because you didn\'t see the side where I practice hard, no one can succeed casually.' },
                    { speaker: '李进', zh: '我从小也对网球感兴趣，但是到现在还是打得不怎么样。', py: 'Wǒ cóngxiǎo yě duì wǎngqiú gǎn xìngqù, dànshì dào xiànzài hái shì dǎ de bù zěnmeyàng.', uz: 'Men ham yoshligimdan tennisga qiziqaman, lekin hozirgacha unchalik yaxshi o\'ynamayman.', ru: 'Я с детства тоже интересовался теннисом, но до сих пор играю не очень.', en: 'I have also been interested in tennis since childhood, but even now I don\'t play that well.' },
                    { speaker: '张远', zh: '你知道吗？不管春夏秋冬，我练球从来没有休息过一天。', py: 'Nǐ zhīdào ma? Bùguǎn chūn xià qiū dōng, wǒ liàn qiú cónglái méiyǒu xiūxiguo yì tiān.', uz: 'Bilasanmi? Bahor, yoz, kuz yoki qish bo\'lishidan qat\'i nazar, men bir kun ham mashq qilishni to\'xtatmaganman.', ru: 'Знаешь? Неважно, весна, лето, осень или зима, я никогда не отдыхал от тренировок ни одного дня.', en: 'Do you know? Regardless of spring, summer, autumn or winter, I have never rested from practicing for a single day.' },
                    { speaker: '李进', zh: '真是不容易啊！看来我只看到了你成功时获得的鲜花，却没注意到你成功前流下的汗水。', py: 'Zhēn shì bù róngyì a! Kànlái wǒ zhǐ kàndàole nǐ chénggōng shí huòdé de xiānhuā, què méi zhùyì dào nǐ chénggōng qián liúxià de hànshuǐ.', uz: 'Haqiqatan ham oson emas! Ko\'rinishidan, men faqat muvaffaqiyat qozonganingda olgan gullaringni ko\'ribman, lekin undan oldin to\'kkan teringga e\'tibor bermabman.', ru: 'Действительно нелегко! Кажется, я видел только цветы, которые ты получил при успехе, но не заметил пот, пролитый тобой до успеха.', en: 'It\'s really not easy! It seems I only saw the flowers you obtained when successful, but didn\'t notice the sweat you shed before your success.' },
                    { speaker: '张远', zh: '任何成功都要通过努力才能得到。只要你坚持练习，我相信你也会越打越好的。', py: 'Rènhé chénggōng dōu yào tōngguò nǔlì cái néng dédào. Zhǐyào nǐ jiānchí liànxí, wǒ xiāngxìn nǐ yě huì yuè dǎ yuè hǎo de.', uz: 'Har qanday muvaffaqiyatga faqat mehnat orqali erishish mumkin. Qat\'iyat bilan mashq qilsang, ishonamanki, sen ham tobora yaxshiroq o\'ynaysan.', ru: 'Любой успех достигается только через усилия. Если ты будешь упорно тренироваться, я верю, что ты тоже будешь играть все лучше.', en: 'Any success must be obtained through effort. As long as you persist in practicing, I believe you will also play better and better.' }
                ]
            },
            {
                id: '09-3',
                context: '小林和小李谈王红的成功经历',
                lines: [
                    { speaker: '小林', zh: '你还记得王红吗？我在报纸上看到一篇关于她的新闻，她现在已经是一个有名的作家了。', py: 'Nǐ hái jìde Wáng Hóng ma? Wǒ zài bàozhǐ shang kàndào yì piān guānyú tā de xīnwén, tā xiànzài yǐjīng shì yí ge yǒumíng de zuòjiā le.', uz: 'Vang Xongni eslaysanmi? Gazetada u haqidagi maqolani ko\'rdim, u hozir mashhur yozuvchi bo\'lib ketibdi.', ru: 'Ты еще помнишь Ван Хун? Я увидел в газете новость о ней, сейчас она уже известный писатель.', en: 'Do you still remember Wang Hong? I saw an article about her in the newspaper, she is now a famous writer.' },
                    { speaker: '小李', zh: '听说她毕业后放弃了律师的工作，开始专门写小说，没想到她竟然成功了。', py: 'Tīngshuō tā bìyè hòu fàngqìle lǜshī de gōngzuò, kāishǐ zhuānmén xiě xiǎoshuō, méi xiǎngdào tā jìngrán chénggōng le.', uz: 'Eshitishimcha, o\'qishni bitirgach yuristlik ishidan voz kechib, faqat roman yozishni boshlabdi, uning muvaffaqiyat qozonishini kutmagandim.', ru: 'Слышал, что после выпуска она бросила работу адвоката и стала специально писать романы, не ожидал, что она в итоге добьется успеха.', en: 'I heard after graduating she gave up her job as a lawyer and started writing novels exclusively, didn\'t expect she would actually succeed.' },
                    { speaker: '小林', zh: '当时她的父母和亲戚都不支持她，可是她坚持自己的选择，现在终于向所有人证明了她的选择是正确的。', py: 'Dāngshí tā de fùmǔ hé qīnqi dōu bù zhīchí tā, kěshì tā jiānchí zìjǐ de xuǎnzé, xiànzài zhōngyú xiàng suǒyǒu rén zhèngmíngle tā de xuǎnzé shì zhèngquè de.', uz: 'O\'sha paytda ota-onasi va qarindoshlari uni qo\'llab-quvvatlashmadi, lekin u o\'z tanlovida qat\'iy turdi, hozir nihoyat hammaga uning tanlovi to\'g\'ri ekanligini isbotladi.', ru: 'В то время ее родители и родственники не поддерживали ее, но она настояла на своем выборе, и теперь наконец доказала всем, что ее выбор был правильным.', en: 'At that time her parents and relatives didn\'t support her, but she persisted in her choice, and now has finally proved to everyone her choice was correct.' },
                    { speaker: '小李', zh: '看来为了自己的理想，放弃一些东西也是值得的。', py: 'Kànlái wèile zìjǐ de lǐxiǎng, fàngqì yìxiē dōngxi yě shì zhídé de.', uz: 'Ko\'rinishidan, o\'z orzusi uchun ba\'zi narsalardan voz kechish ham arziydi.', ru: 'Кажется, ради своих идеалов стоит от чего-то отказаться.', en: 'It seems for the sake of one\'s ideals, giving up some things is also worth it.' },
                    { speaker: '小林', zh: '一个人只有两只手，不可能得到所有想要的东西，所以有时候放弃是一种聪明的选择。', py: 'Yí ge rén zhǐ yǒu liǎng zhī shǒu, bù kěnéng dédào suǒyǒu xiǎng yào de dōngxi, suǒyǐ yǒu shíhou fàngqì shì yì zhǒng cōngming de xuǎnzé.', uz: 'Insonning faqat ikkita qo\'li bor, barcha xohlagan narsasiga erishishi mumkin emas, shuning uchun ba\'zan voz kechish - bu aqlli tanlovdir.', ru: 'У человека только две руки, невозможно получить всё, что хочется, поэтому иногда отказаться — это умный выбор.', en: 'A person only has two hands, impossible to get everything they want, so sometimes giving up is a smart choice.' },
                    { speaker: '小李', zh: '是啊，只有学会放弃，才能把自己的能力用到最该做的事情上，最后获得成功。', py: 'Shì a, zhǐyǒu xuéhuì fàngqì, cái néng bǎ zìjǐ de nénglì yòngdào zuì gāi zuò de shìqing shang, zuìhòu huòdé chénggōng.', uz: 'Shunday, faqat voz kechishni o\'rganibgina, o\'z qobiliyatini eng kerakli ishga yo\'naltirish va pirovardida muvaffaqiyat qozonish mumkin.', ru: 'Да, только научившись отказываться, можно направить свои способности на самое важное дело и в итоге добиться успеха.', en: 'Yes, only by learning to give up can one use their abilities on the things that most need to be done, and ultimately achieve success.' }
                ]
            },
            {
                id: '09-4',
                context: 'Text 4',
                lines: [
                    { speaker: 'Matn', zh: '如果你想做什么事情，那就勇敢地去做，不要担心结果，不要考虑会不会失败。', py: 'Rúguǒ nǐ xiǎng zuò shénme shìqing, nà jiù yǒnggǎn de qù zuò, búyào dānxīn jiéguǒ, búyào kǎolǜ huì bu huì shībài.', uz: 'Agar biror ishni qilishni xohlasangiz, uni qo\'rqmasdan qiling, natijadan xavotirlanmang, muvaffaqiyatsizlikka uchraymanmi deb o\'ylamang.', ru: 'Если ты хочешь что-то сделать, делай это смело, не беспокойся о результате, не думай, потерпишь ли ты неудачу.', en: 'If you want to do something, then bravely go do it, don\'t worry about the result, don\'t consider whether you will fail.' },
                    { speaker: 'Matn', zh: '要是太看重结果，失败就会给人们带来很多烦恼。', py: 'Yàoshi tài kànzhòng jiéguǒ, shībài jiù huì gěi rénmen dàilái hěnduō fánnǎo.', uz: 'Agar natijaga juda katta ahamiyat bersangiz, muvaffaqiyatsizlik odamlarga ko\'p tashvish keltiradi.', ru: 'Если слишком ценить результат, неудача принесет людям много огорчений.', en: 'If you value the result too much, failure will bring people a lot of annoyance.' },
                    { speaker: 'Matn', zh: '我们应该把注意力放在做事情的过程上，这样你会在做的过程中发现解决问题的快乐，这是其他任何东西都给不了的。', py: 'Wǒmen yīnggāi bǎ zhùyìlì fàng zài zuò shìqing de guòchéng shang, zhèyàng nǐ huì zài zuò de guòchéng zhōng fāxiàn jiějué wèntí de kuàilè, zhè shì qítā rènhé dōngxi dōu gěi bu liǎo de.', uz: 'Biz e\'tiborimizni ishni bajarish jarayoniga qaratishimiz kerak, shunda siz bu jarayonda muammolarni hal qilish quvonchini topasiz, buni boshqa hech narsa bera olmaydi.', ru: 'Мы должны сосредоточить внимание на процессе выполнения дела, так ты в процессе делания откроешь для себя радость решения проблем, которую не может дать ничто другое.', en: 'We should focus our attention on the process of doing things, this way you will find the joy of solving problems during the process, this is something no other thing can give.' },
                    { speaker: 'Matn', zh: '即使最后失败了也没有关系，因为至少你已经努力过，而且我们还可以从失败中总结出有用的经验，有了这些积累，成功自然离我们越来越近。', py: 'Jíshǐ zuìhòu shībài le yě méiyǒu guānxi, yīnwèi zhìshǎo nǐ yǐjīng nǔlì guò, érqiě wǒmen hái kěyǐ cóng shībài zhōng zǒngjié chū yǒuyòng de jīngyàn, yǒule zhèxiē jīlěi, chénggōng zìrán lí wǒmen yuè lái yuè jìn.', uz: 'Hatto oxirida muvaffaqiyatsizlikka uchrasangiz ham hechqisi yo\'q, chunki hech bo\'lmaganda siz harakat qildingiz, qolaversa, muvaffaqiyatsizlikdan foydali tajriba xulosa qilishimiz mumkin, bu to\'plangan tajribalar bilan muvaffaqiyat, tabiiyki, bizga tobora yaqinlashadi.', ru: 'Даже если в конце концов постигнет неудача, это не имеет значения, потому что по крайней мере ты уже старался, к тому же мы можем извлечь полезный опыт из неудачи. С такими накоплениями успех естественно будет становиться все ближе.', en: 'Even if it fails in the end it doesn\'t matter, because at least you have tried, and we can also sum up useful experience from failure. With these accumulations, success will naturally get closer and closer to us.' }

             {

                    { speaker: 'Matn', zh: '每一个人都希望成功，可是很多时候，在成功之前会遇到很多困难。', py: 'Měi yí ge rén dōu xīwàng chénggōng, kěshì hěnduō shíhou, zài chénggōng zhīqián huì yùdào hěnduō kùnnan.', uz: 'Har bir inson muvaffaqiyat qozonishni xohlaydi, lekin ko\'pincha muvaffaqiyatdan oldin ko\'plab qiyinchiliklarga duch kelinadi.', ru: 'Каждый человек надеется на успех, но часто до успеха сталкивается со многими трудностями.', en: 'Everyone hopes for success, but many times, before success, one will encounter many difficulties.' },

                let distractors = [...VOCABULARY].filter(v => v.uz !== word.uz).sort(() => 0.5 - Math.random());

        function GenericTest({ title, questions, optionsLang = 'uz' }) {
            const [currentQ, setCurrentQ] = React.useState(0);
            const [score, setScore] = React.useState(0);
            const [showResult, setShowResult] = React.useState(false);
            const [selectedIdx, setSelectedIdx] = React.useState(null);
            const [answered, setAnswered] = React.useState(false);

            const handleAnswer = (option, idx) => {
                if (answered) return;
                setSelectedIdx(idx);
                setAnswered(true);
                
                if (option === questions[currentQ].a) {
                    setScore(prev => prev + 1);
                }

                setTimeout(() => {
                    if (currentQ < questions.length - 1) {
                        setCurrentQ(prev => prev + 1);
                        setSelectedIdx(null);
                        setAnswered(false);
                    } else {
                        setShowResult(true);
                    }
                }, 1000);
            };

            const resetTest = () => {
                setCurrentQ(0);
                setScore(0);
                setShowResult(false);
                setSelectedIdx(null);
                setAnswered(false);
            };

            if (showResult) {
                return (
                    <div className="glass-panel p-10 rounded-3xl text-center max-w-lg mx-auto mt-10 shadow-2xl">
                        <h2 className="text-4xl font-bold text-white mb-4">Test Yakunlandi!</h2>
                        <p className="text-2xl text-slate-300 mb-8">Sizning natijangiz: <span className="text-indigo-400 font-bold">{score} / {questions.length}</span></p>
                        <div className="w-full bg-slate-700 h-4 rounded-full mb-8 overflow-hidden">
                            <div className="bg-indigo-500 h-full transition-all duration-1000" style={{width: `${(score/questions.length)*100}%`}}></div>
                        </div>
                        <button onClick={resetTest} className="px-8 py-3 bg-indigo-600 hover:bg-indigo-500 rounded-full font-medium transition-all text-white shadow-lg">
                            Qaytadan urinib ko'rish
                        </button>
                    </div>
                );
            }

            const q = questions[currentQ];

            return (
                <div className="w-full max-w-3xl mx-auto mt-8">
                    <div className="flex justify-between items-center mb-6 px-4">
                        <span className="text-slate-400 font-medium">Savol {currentQ + 1} / {questions.length}</span>

                            <h2 className="text-4xl md:text-5xl font-bold zh-text text-white leading-tight">{q.q}</h2>
                            {optionsLang === 'uz' && !q.q.includes('_') && ( // only show audio for vocab test, not fill blanks
                                <button onClick={() => playAudio(q.q)} className="p-3 bg-slate-700 hover:bg-slate-600 rounded-full text-indigo-400 shrink-0 ml-4">
                                    <svg xmlns="http://www.w3.org/2000/svg" className="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5 12h4l4-4v12l-4-4H5z" /></svg>
                                </button>
                            )}
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            {q.options.map((opt, idx) => {
                                let btnClass = "p-6 rounded-2xl text-left font-medium text-lg transition-all border ";
                                if (!answered) {
                                    btnClass += "bg-slate-800 border-slate-700 hover:border-indigo-500 hover:bg-slate-750 text-slate-200 cursor-pointer";
                                } else {
                                    if (opt === q.a) {
                                        btnClass += "bg-green-900/50 border-green-500 text-green-200";
                                    } else if (idx === selectedIdx) {
                                        btnClass += "bg-red-900/50 border-red-500 text-red-200";
                                    } else {
                                        btnClass += "bg-slate-800 border-slate-700 text-slate-500 opacity-50";
                                    }
                                }

                                return (
                                    <button 
                                        key={idx} 
                                        disabled={answered}
                                        onClick={() => handleAnswer(opt, idx)}
                                        className={btnClass}
                                    >
                                        {opt}
                                    </button>
                                );
                            })}
                        </div>
                    </div>
                </div>
            );
        }

        function Dialogues() {
            return (
                <div className="w-full max-w-4xl mx-auto space-y-12 pb-10">
                    {DIALOGUES.map((dialogue, idx) => (
                        <div key={idx} className="glass-panel p-6 md:p-10 rounded-3xl shadow-xl">
                            <div className="mb-8 border-b border-slate-700 pb-4">
                                <h3 className="text-2xl font-bold text-white zh-text">{dialogue.context}</h3>
                                <p className="text-indigo-400 font-medium">Text {dialogue.id}</p>
                            </div>
                            
                            <div className="space-y-8">
                                {dialogue.lines.map((line, lIdx) => (
                                    <div key={lIdx} className="flex gap-4">
                                        <div className="shrink-0 w-12 h-12 rounded-full bg-indigo-600 flex items-center justify-center font-bold text-white shadow-lg text-sm">
                                            {line.speaker === 'Matn' ? 'T' : line.speaker.charAt(0)}
                                        </div>
                                        <div className="flex-1 space-y-2 bg-slate-800 p-5 rounded-2xl rounded-tl-none border border-slate-700 relative group">
                                            
                                            <button 
                                                onClick={() => playAudio(line.zh)}
                                                className="absolute top-4 right-4 p-2 bg-slate-700 hover:bg-slate-600 rounded-full text-indigo-400 opacity-0 group-hover:opacity-100 transition-opacity"
                                            >
                                                 <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5 12h4l4-4v12l-4-4H5z" /></svg>
                                            </button>

                                            <p className="text-2xl font-bold zh-text text-white pr-10 leading-relaxed">{line.zh}</p>
                                            <p className="text-indigo-300 font-medium">{line.py}</p>
                                            
                                            <div className="mt-4 pt-4 border-t border-slate-700 space-y-2">
                                                <p className="text-sm"><span className="font-semibold text-slate-500 mr-2">UZ:</span> <span className="text-slate-300">{line.uz}</span></p>
                                                <p className="text-sm"><span className="font-semibold text-slate-500 mr-2">RU:</span> <span className="text-slate-300">{line.ru}</span></p>
                                                <p className="text-sm"><span className="font-semibold text-slate-500 mr-2">EN:</span> <span className="text-slate-300">{line.en}</span></p>
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    ))}
                </div>
            );
        }

        function Grammar() {
            return (
                <div className="w-full max-w-4xl mx-auto space-y-8 pb-10">
                    {GRAMMAR.map((item, idx) => (
                        <div key={idx} className="glass-panel p-8 rounded-3xl shadow-xl">
                            <h3 className="text-3xl font-bold zh-text text-indigo-400 mb-4">{item.point}</h3>
                            <p className="text-lg text-slate-300 mb-8 p-4 bg-slate-800 rounded-xl border border-slate-700">{item.explanation}</p>
                            
                            <div className="space-y-4">
                                <h4 className="text-sm uppercase tracking-wider font-bold text-slate-500 mb-2">Misollar (Examples)</h4>
                                {item.examples.map((ex, eIdx) => (
                                    <div key={eIdx} className="bg-slate-900/50 p-5 rounded-2xl border border-slate-800 relative group">
                                        <button 
                                            onClick={() => playAudio(ex.zh)}
                                            className="absolute top-4 right-4 p-2 bg-slate-800 hover:bg-slate-700 rounded-full text-indigo-400 transition-colors"
                                        >
                                            <svg xmlns="http://www.w3.org/2000/svg" className="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5 12h4l4-4v12l-4-4H5z" /></svg>
                                        </button>
                                        <p className="text-xl font-bold zh-text text-white pr-8 mb-2">{ex.zh}</p>
                                        <p className="text-indigo-300 font-medium mb-3">{ex.py}</p>
                                        <p className="text-slate-400 text-sm border-t border-slate-800 pt-3">{ex.uz}</p>
                                    </div>
                                ))}
                            </div>
                        </div>
                    ))}
                </div>
            );
        }

        function App() {
            const [activeTab, setActiveTab] = React.useState('flashcards');
            // Memoize generated vocab test so it doesn't shuffle on every render
            const vocabTestQuestions = React.useMemo(() => generateVocabTest(), [activeTab]);

            const tabs = [
                { id: 'flashcards', label: 'Fleshkartalar' },
                { id: 'vocabTest', label: 'Lug\'at Testi' },
                { id: 'dialogue', label: 'Muloqot' },
                { id: 'grammar', label: 'Grammatika' },
                { id: 'grammarTest', label: 'Grammatika Testi' },
                { id: 'fillBlanks', label: 'So\'zlarni to\'ldirish' }
            ];

            return (
                <div className="min-h-screen flex flex-col relative overflow-hidden">
                    {/* Background SVG decorative elements */}
                    <div className="fixed top-0 left-0 w-full h-full overflow-hidden -z-10 opacity-30 pointer-events-none">
                        <svg viewBox="0 0 100 100" preserveAspectRatio="none" className="absolute top-[-20%] left-[-10%] w-[50%] h-[50%] text-indigo-900/50 fill-current blur-3xl">
                            <circle cx="50" cy="50" r="50" />
                        </svg>
                        <svg viewBox="0 0 100 100" preserveAspectRatio="none" className="absolute bottom-[-20%] right-[-10%] w-[60%] h-[60%] text-blue-900/40 fill-current blur-3xl">
                            <circle cx="50" cy="50" r="50" />
                        </svg>
                    </div>

                    {/* Header */}
                    <header className="glass-panel sticky top-0 z-50 border-b border-slate-800/50">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
                            <div className="flex flex-col md:flex-row justify-between items-center gap-4">
                                <div className="text-center md:text-left">
                                    <h1 className="text-2xl font-bold text-white bg-clip-text text-transparent bg-gradient-to-r from-indigo-400 to-cyan-400">
                                        HSK 4 · Lesson 9
                                    </h1>
                                    <h2 className="text-sm font-medium text-slate-400 mt-1">Dilfuza Kāng lǎo shī bilan xitoy tilini o'rganmiz</h2>
                                </div>
                                
                                {/* Navigation */}
                                <nav className="flex flex-wrap justify-center gap-2">
                                    {tabs.map(tab => (
                                        <button
                                            key={tab.id}
                                            onClick={() => setActiveTab(tab.id)}
                                            className={`px-4 py-2 rounded-full text-sm font-medium transition-all duration-300 ${
                                                activeTab === tab.id 
                                                ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-500/30' 
                                                : 'bg-slate-800 text-slate-400 hover:bg-slate-700 hover:text-white'
                                            }`}
                                        >
                                            {tab.label}
                                        </button>
                                    ))}
                                </nav>
                            </div>
                        </div>
                    </header>

                    {/* Main Content Area */}
                    <main className="flex-1 w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
                        {activeTab === 'flashcards' && <Flashcards />}
                        {activeTab === 'vocabTest' && <GenericTest title="Lug'at Testi" questions={vocabTestQuestions} optionsLang="uz" />}
                        {activeTab === 'dialogue' && <Dialogues />}
                        {activeTab === 'grammar' && <Grammar />}
                        {activeTab === 'grammarTest' && <GenericTest title="Grammatika Testi" questions={TEST_GRAMMAR} optionsLang="zh" />}
                        {activeTab === 'fillBlanks' && <GenericTest title="So'zlarni to'ldirish" questions={TEST_FILL_BLANKS} optionsLang="zh" />}
                    </main>

                    {/* Footer */}
                    <footer className="mt-auto py-8 text-center text-slate-500 text-sm glass-panel border-t border-slate-800/50">
                        <p className="font-semibold text-slate-400">HSK 9 - Lesson 9</p>
                        <p className="mt-1">© 2026 Dilfuza Kāng lǎo shī (telegram@diffila)</p>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
